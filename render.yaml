services:
  - type: web
    name: northstar-oauth
    rootDir: oauth-server
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CHATGPT_CLIENT_ID
        sync: false
      - key: CHATGPT_REDIRECT_URIS
        sync: false
      - key: OAUTH_ISSUER
        sync: false
      - key: MCP_RESOURCE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MCP_INTROSPECTION_SECRET
        sync: false
      - key: OAUTH_STORAGE_DATABASE_URL
        sync: false
      - key: OAUTH_JWKS_JSON
        sync: false

  - type: web
    name: northstar-mcp
    runtime: node
    plan: free
    # Keep repository-root access to the shared public Supabase CA certificate.
    buildCommand: npm --prefix mcp-server ci
    startCommand: node mcp-server/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: OAUTH_ISSUER
        sync: false
      - key: OAUTH_INTROSPECTION_URL
        sync: false
      - key: OAUTH_CLIENT_ID
        value: northstar-mcp-backend
      - key: OAUTH_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NORTHSTAR_API_URL
        sync: false
      - key: MCP_RESOURCE
        sync: false
